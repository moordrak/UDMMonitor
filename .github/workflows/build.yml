name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk UdmMonitor.apk

      # APK se objavljuje kao GitHub Release "latest" (Releases stranica repoa).
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest UdmMonitor.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "UDM Monitor (zadnji build)" \
            --notes "Automatski build iz commita ${GITHUB_SHA::7}."

      # Rezerva; ne ruši build ako GitHubov artifact servis ne radi.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: UdmMonitor-apk
          path: UdmMonitor.apk
